[project]
name = "local-privacy-ai-service"
version = "0.1.0"
license = "Apache-2.0"
description = "Local PII inference service for Local Privacy Agent (Laya span classifier behind a PiiClassifier abstraction)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# The real model. Kept optional so the API, adapter and tests run without torch.
model = [
    "laya>=0.3.6,!=0.3.7",
    "torch>=2.2",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
